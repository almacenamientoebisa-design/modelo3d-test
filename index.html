<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver modelo 3D</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f2f2f2;
      font-family: -apple-system, sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100vh;
      --poster-color: transparent;
    }
    .titulo {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.55);
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="titulo">Toca y arrastra para rotar. Usa el botón AR para verlo en tu espacio.</div>

  <!--
    IMPORTANTE - reemplaza los nombres de archivo:
    - src: tu archivo .glb (funciona en el visor 3D y en AR de Android)
    - ios-src: tu archivo .usdz (necesario para que el AR funcione en iPhone)
    Sube ambos archivos a la misma carpeta que este index.html
  -->
  <model-viewer
    src="modelo.glb"
    ios-src="modelo.usdz"
    alt="Modelo 3D"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1">
  </model-viewer>

</body>
</html>
